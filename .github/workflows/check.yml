name: Checks

# Catches malformed PowerShell inside workflow `run:` blocks before it can reach
# main. Run 30972262339 lost a completed 55-country desk run to a ParserError in
# the commit step - the API work was already paid for by the time it surfaced.

on:
  push:
    paths:
      - '.github/workflows/**'
      - 'scripts/**'
      - 'app.js'
      - 'selftest.js'
      - 'index.html'
      - 'styles.css'
      - 'data/**'
      - 'tools/stress/**'
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'scripts/**'
      - 'app.js'
      - 'selftest.js'
      - 'index.html'
      - 'styles.css'
      - 'data/**'
      - 'tools/stress/**'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  syntax:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Browser script parses
        shell: pwsh
        run: |
          node --check app.js;      if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node --check selftest.js

      - name: Workflow PowerShell parses
        shell: pwsh
        run: ./scripts/check-workflows.ps1

      - name: Pipeline scripts parse
        shell: pwsh
        run: |
          $failed = 0
          foreach ($f in Get-ChildItem scripts -Filter '*.ps1') {
            $errors = $null
            [void][System.Management.Automation.PSParser]::Tokenize(
              (Get-Content $f.FullName -Raw), [ref]$errors)
            if ($errors.Count) {
              $failed++
              Write-Host "FAIL $($f.Name): line $($errors[0].Token.StartLine) $($errors[0].Message)"
            } else {
              Write-Host "OK   $($f.Name)"
            }
          }
          if ($failed) { exit 1 }

      - name: Ranking behavior
        shell: pwsh
        run: |
          # Only the last command's exit code fails a pwsh step; check each one.
          ./scripts/test-news-ranking.ps1;     if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./scripts/test-story-contract.ps1;   if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./scripts/test-article-evidence.ps1; if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./scripts/test-food-basket.ps1;      if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./scripts/test-story-case.ps1;       if ($LASTEXITCODE) { exit $LASTEXITCODE }
          # Built pages belong to the desk and are checked as it builds them.
          ./scripts/test-static-pages.ps1 -UnitOnly

      - name: Published payload validates
        shell: pwsh
        run: ./scripts/validate-briefs.ps1

      - name: Scripts and workflows are ASCII-only
        shell: pwsh
        run: |
          # Windows PowerShell 5.1 reads a UTF-8 file with no BOM as ANSI, which
          # mangles multi-byte characters and can break string parsing. Keep build
          # files ASCII; non-ASCII belongs in content files, not tooling.
          $bad = 0
          foreach ($f in @(Get-ChildItem scripts -Filter '*.ps1') + @(Get-ChildItem .github/workflows -Filter '*.yml')) {
            $hits = [regex]::Matches([IO.File]::ReadAllText($f.FullName), '[^\x00-\x7F]')
            if ($hits.Count) {
              $bad++
              Write-Host "FAIL $($f.Name): $($hits.Count) non-ASCII char(s), first is U+$('{0:X4}' -f [int][char]$hits[0].Value)"
            }
          }
          if ($bad) { Write-Host 'Replace with ASCII equivalents (em dash -> hyphen).'; exit 1 }
          Write-Host 'OK - all build files are ASCII'

  browser:
    # Map hit-testing for all 55 countries, island tags clear of every coast, no
    # NaN/undefined in any country panel or lens, sane market numbers, and no private
    # owner details anywhere in the shipped files.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      # Node 20 reached end of life in April 2026. 22 is the maintained LTS line.
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm i playwright@1 >/dev/null
          npx playwright install --with-deps chromium
      - name: Site check
        run: NODE_PATH=/tmp/pw/node_modules node tools/stress/site-check.mjs

  desk:
    # The writer's repair loop end to end: write-briefs.ps1 runs for real against a
    # stand-in model on 127.0.0.1 (no key, no network). Clean drafts, style rewrites,
    # off-country drops, capped speculative lens scores and the fact-checked fallback.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Desk harness
        shell: pwsh
        run: ./scripts/test-desk-harness.ps1
