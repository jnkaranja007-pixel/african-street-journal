name: Refresh market data

# Markets live in their own workflow rather than inside the desk run. They failed on
# the runner on 27 August - every exchange timed out at 25s while the same URLs answered
# instantly from a home connection - and coupling them to the newsroom meant the only
# way to test a fix was to spend a full model run. Separated, this is cheap to retry,
# cheap to dispatch, and a market outage cannot slow or complicate publishing a paper.

on:
  schedule:
    # After the desk has published, so a market commit never races the story commit.
    - cron: '43 6 * * *'
  workflow_dispatch:
    inputs:
      test_repair:
        description: "Prove the redesign repair: skip the site parsers (meaning) or the parsers and the meaning reader (ai). Nothing is committed."
        type: choice
        options: [none, meaning, ai]
        default: none

permissions:
  contents: write

concurrency:
  group: refresh-markets
  cancel-in-progress: false

jobs:
  markets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Fetch exchange listings
        id: fetch
        shell: pwsh
        continue-on-error: true
        timeout-minutes: 6
        # AFX drops runner traffic. With the ASJ_AFX_RELAY repository variable set to the
        # tools/afx-relay Worker's URL, the pages come through Cloudflare instead.
        env:
          ASJ_AFX_RELAY: ${{ vars.ASJ_AFX_RELAY }}
        run: ./scripts/update-markets.ps1

      - name: Fetch exchange indices
        id: indices
        shell: pwsh
        continue-on-error: true
        timeout-minutes: 6
        # Headline index per exchange from a source the runner can reach. Independent of
        # the company listings above, so one dead host cannot blank both.
        # Falls back to afx.kwayisi.org, through the relay when it is set.
        env:
          ASJ_AFX_RELAY: ${{ vars.ASJ_AFX_RELAY }}
          # The AI reader for a redesigned exchange site (scripts/update-indices.ps1).
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ASJ_INDICES_SKIP: ${{ inputs.test_repair == 'meaning' && 'structured' || inputs.test_repair == 'ai' && 'structured,generic' || '' }}
        run: ./scripts/update-indices.ps1

      - name: Report unreachable source
        if: steps.fetch.outcome == 'failure'
        shell: pwsh
        run: |
          # Deliberately not a job failure. Stale market data is a known, labelled state
          # - every entry carries its own asOf - and it must never page anyone or block
          # the newsroom. This line exists so the reason is in the log rather than
          # inferred from an unchanged file.
          Write-Host 'Market source unreachable from this runner; existing data left in place.'
          Write-Host 'The panel keeps showing its last asOf date rather than a wrong number.'
          # One bad day is not news. A week is: from 22 September 2026 every exchange failed
          # (AFX stopped answering GitHub's runners - it still answers a desktop - and its
          # listing table also lost a closing tag), this step said the above for a month,
          # and nobody looked. Past seven days the job goes red so the failure is seen. The
          # commit step below still runs, so index levels keep updating.
          # pwsh's ConvertFrom-Json hands back asOf as [datetime], not the string in the
          # file; take either.
          $m = Get-Content data/markets.json -Raw | ConvertFrom-Json
          $ages = @($m.PSObject.Properties | ForEach-Object {
            $d = $_.Value.asOf
            if ($d -isnot [datetime]) { $d = [datetime]::Parse([string]$d, [Globalization.CultureInfo]::InvariantCulture) }
            ((Get-Date).ToUniversalTime() - $d).TotalDays
          })
          $age = ($ages | Measure-Object -Minimum).Minimum
          if ($age -gt 7) { Write-Host "::error::Exchange listings are $([int]$age) days old. Check scripts/update-markets.ps1 against afx.kwayisi.org."; exit 1 }

      - name: Alarm on stale index levels
        # From 1 Nov 2026 the index source showed a maintenance page, the step above kept
        # the old file, and the run stayed green for ten days while the site said "Stale".
        # Past four days without a fresh session (a long weekend is three) the job goes red
        # so the failure is seen. The commit step below still runs.
        # It used to judge only the newest row, so one fresh exchange hid sixteen stale ones,
        # and it never asked whether the indices step itself had failed: from 17 Nov 2026 that
        # step wrote fresh rows, ended on a stray exit code, and the commit step skipped them
        # on every run while this stayed green. Now it checks each exchange and the step's
        # outcome, and puts a table of every exchange in the run summary.
        if: always()
        shell: pwsh
        env:
          INDICES_OUTCOME: ${{ steps.indices.outcome }}
          # An exchange is stale past this many days (a long weekend plus a holiday is four).
          STALE_DAYS: '5'
          # More stale exchanges than this turns the job red. Zambia has no source the runner
          # may use, and Uganda is skipped by a run during its trading hours.
          MAX_STALE: '3'
        run: |
          $inv = [Globalization.CultureInfo]::InvariantCulture
          $t = Get-Content data/indices.js -Raw
          $a = $t.IndexOf('{'); $b = $t.LastIndexOf('}')
          if ($a -lt 0 -or $b -le $a) { Write-Host '::error::data/indices.js holds no JSON.'; exit 1 }
          $data = ($t.Substring($a, $b - $a + 1) | ConvertFrom-Json)
          $today = (Get-Date).ToUniversalTime().Date
          $staleDays = [int]$env:STALE_DAYS
          # pwsh's ConvertFrom-Json hands dates back as [datetime]; take either.
          $rows = @(foreach ($p in $data.indices.PSObject.Properties) {
            $o = $p.Value; $d = $o.date
            if ($d -isnot [datetime]) { $d = [datetime]::ParseExact([string]$d, 'yyyy-MM-dd', $inv) }
            [pscustomobject]@{ code = $o.code; level = $o.level; pct = $o.changePct; day = $d.Date; age = [int]($today - $d.Date).TotalDays; source = $o.source }
          })
          if (-not $rows.Count) { Write-Host '::error::data/indices.js holds no dated index rows.'; exit 1 }

          $md = @('### Index levels', '', "Step outcome: $env:INDICES_OUTCOME", '', '| Exchange | Level | Move | Session | Days old | Source |', '|---|---:|---:|---|---:|---|')
          foreach ($r in ($rows | Sort-Object age, code)) {
            $mv = if ($r.pct -is [double] -or $r.pct -is [int] -or $r.pct -is [long] -or $r.pct -is [decimal]) { [string]::Format($inv, '{0:+0.00;-0.00;0.00}%', [double]$r.pct) } else { 'none' }
            $flag = if ($r.age -gt $staleDays) { ' stale' } else { '' }
            $md += "| $($r.code) | $([string]::Format($inv, '{0:N2}', [double]$r.level)) | $mv | $($r.day.ToString('yyyy-MM-dd')) | $($r.age)$flag | $($r.source) |"
          }
          if ($env:GITHUB_STEP_SUMMARY) { Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ($md -join "`n") }

          $bad = $false
          $newest = ($rows | Measure-Object age -Minimum).Minimum
          Write-Host "Newest index session: $newest days old"
          if ($newest -gt 4) {
            Write-Host "::error::Every index level is at least $newest days old. See the indices step log: each exchange site, TradingView and afx.kwayisi.org failed or were refused."
            $bad = $true
          }
          $stale = @($rows | Where-Object { $_.age -gt $staleDays } | Sort-Object age -Descending)
          foreach ($r in $stale) { Write-Host "::warning::$($r.code) last session $($r.day.ToString('yyyy-MM-dd')) ($($r.age) days old, from $($r.source))" }
          Write-Host "$($rows.Count - $stale.Count) of $($rows.Count) exchanges are current"
          if ($stale.Count -gt [int]$env:MAX_STALE) {
            Write-Host "::error::$($stale.Count) of $($rows.Count) exchanges are more than $staleDays days old: $(($stale | ForEach-Object { $_.code }) -join ', '). Their sources are in scripts/update-indices.ps1; the warnings in the indices step log say which parser stopped matching."
            $bad = $true
          }
          # Failure here means fewer than four fresh rows or a crash. Either way nothing new is saved.
          if ($env:INDICES_OUTCOME -eq 'failure') {
            Write-Host '::error::The indices step failed, so this run saves no index levels. See its log.'
            $bad = $true
          }
          if ($bad) { exit 1 }

      - name: Commit refreshed markets
        # always(): the stale-listings alarm above fails the job on purpose, and must not
        # stop the index levels it does not concern from being saved.
        if: always() && (steps.fetch.outcome == 'success' || steps.indices.outcome == 'success') && (inputs.test_repair == '' || inputs.test_repair == 'none')
        shell: pwsh
        run: |
          git config user.name  "asj-news-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/markets.json data/indices.js
          git diff --staged --quiet
          if ($LASTEXITCODE -eq 0) { Write-Host 'Markets unchanged.'; exit 0 }
          $stamp = (Get-Date).ToUniversalTime().ToString('yyyy-MM-dd')
          git commit -m "chore(markets): refresh exchange listings ($stamp)"
          if ($LASTEXITCODE -ne 0) { Write-Host 'Commit failed.'; exit 1 }
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            git push
            if ($LASTEXITCODE -eq 0) { Write-Host 'Pushed markets.'; exit 0 }
            Write-Host "Push rejected (attempt $attempt) - rebasing and retrying."
            git pull --rebase origin main
            if ($LASTEXITCODE -ne 0) { Write-Host 'Rebase failed - resolve by hand.'; exit 1 }
          }
          Write-Host 'Push failed after 3 attempts.'
          exit 1
