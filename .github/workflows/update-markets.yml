name: Refresh market data

# Markets live in their own workflow rather than inside the desk run. They failed on
# the runner on 27 August - every exchange timed out at 25s while the same URLs answered
# instantly from a home connection - and coupling them to the newsroom meant the only
# way to test a fix was to spend a full model run. Separated, this is cheap to retry,
# cheap to dispatch, and a market outage cannot slow or complicate publishing a paper.

on:
  schedule:
    # After the desk has published, so a market commit never races the story commit.
    - cron: '43 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh-markets
  cancel-in-progress: false

jobs:
  markets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Fetch exchange listings
        id: fetch
        shell: pwsh
        continue-on-error: true
        timeout-minutes: 6
        # AFX drops runner traffic. With the ASJ_AFX_RELAY repository variable set to the
        # tools/afx-relay Worker's URL, the pages come through Cloudflare instead.
        env:
          ASJ_AFX_RELAY: ${{ vars.ASJ_AFX_RELAY }}
        run: ./scripts/update-markets.ps1

      - name: Fetch exchange indices
        id: indices
        shell: pwsh
        continue-on-error: true
        timeout-minutes: 3
        # Headline index per exchange from a source the runner can reach. Independent of
        # the company listings above, so one dead host cannot blank both.
        run: ./scripts/update-indices.ps1

      - name: Report unreachable source
        if: steps.fetch.outcome == 'failure'
        shell: pwsh
        run: |
          # Deliberately not a job failure. Stale market data is a known, labelled state
          # - every entry carries its own asOf - and it must never page anyone or block
          # the newsroom. This line exists so the reason is in the log rather than
          # inferred from an unchanged file.
          Write-Host 'Market source unreachable from this runner; existing data left in place.'
          Write-Host 'The panel keeps showing its last asOf date rather than a wrong number.'
          # One bad day is not news. A week is: from 22 September 2026 every exchange failed
          # (AFX stopped answering GitHub's runners - it still answers a desktop - and its
          # listing table also lost a closing tag), this step said the above for a month,
          # and nobody looked. Past seven days the job goes red so the failure is seen. The
          # commit step below still runs, so index levels keep updating.
          # pwsh's ConvertFrom-Json hands back asOf as [datetime], not the string in the
          # file; take either.
          $m = Get-Content data/markets.json -Raw | ConvertFrom-Json
          $ages = @($m.PSObject.Properties | ForEach-Object {
            $d = $_.Value.asOf
            if ($d -isnot [datetime]) { $d = [datetime]::Parse([string]$d, [Globalization.CultureInfo]::InvariantCulture) }
            ((Get-Date).ToUniversalTime() - $d).TotalDays
          })
          $age = ($ages | Measure-Object -Minimum).Minimum
          if ($age -gt 7) { Write-Host "::error::Exchange listings are $([int]$age) days old. Check scripts/update-markets.ps1 against afx.kwayisi.org."; exit 1 }

      - name: Commit refreshed markets
        # always(): the stale-listings alarm above fails the job on purpose, and must not
        # stop the index levels it does not concern from being saved.
        if: always() && (steps.fetch.outcome == 'success' || steps.indices.outcome == 'success')
        shell: pwsh
        run: |
          git config user.name  "asj-news-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/markets.json data/indices.js
          git diff --staged --quiet
          if ($LASTEXITCODE -eq 0) { Write-Host 'Markets unchanged.'; exit 0 }
          $stamp = (Get-Date).ToUniversalTime().ToString('yyyy-MM-dd')
          git commit -m "chore(markets): refresh exchange listings ($stamp)"
          if ($LASTEXITCODE -ne 0) { Write-Host 'Commit failed.'; exit 1 }
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            git push
            if ($LASTEXITCODE -eq 0) { Write-Host 'Pushed markets.'; exit 0 }
            Write-Host "Push rejected (attempt $attempt) - rebasing and retrying."
            git pull --rebase origin main
            if ($LASTEXITCODE -ne 0) { Write-Host 'Rebase failed - resolve by hand.'; exit 1 }
          }
          Write-Host 'Push failed after 3 attempts.'
          exit 1
