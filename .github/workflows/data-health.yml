name: Data health

# Daily: is every source still fresh (news desk, exchange listings, country facts,
# railways, food prices)? Monthly: does the data still agree with a second source
# (railways against the CIA World Factbook, landmarks against Wikidata, city lists)?
# A problem opens - or comments on - one GitHub issue titled "Data health"; a clean
# daily run closes it. Until Oct 2026 every stale source was found by someone noticing.

on:
  schedule:
    - cron: '30 9 * * *'    # 09:30 UTC daily, after the desk's 01:40 and 03:40 slots
    - cron: '0 6 2 * *'     # 06:00 UTC on the 2nd, the monthly cross-check
  workflow_dispatch:
    inputs:
      mode:
        description: 'Daily (freshness) or Monthly (cross-check against other sources)'
        required: true
        default: 'Daily'
        type: choice
        options: ['Daily', 'Monthly']

permissions:
  contents: read
  issues: write

jobs:
  check:
    # Windows, like the other data jobs: the script's paths are Windows-style.
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check
        id: check
        shell: pwsh
        run: |
          $mode = '${{ github.event.inputs.mode }}'
          if (-not $mode) { $mode = if ('${{ github.event.schedule }}' -eq '0 6 2 * *') { 'Monthly' } else { 'Daily' } }
          "mode=$mode" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          ./scripts/check-data-health.ps1 -Mode $mode -Report "$env:RUNNER_TEMP/data-health.md"
          "failed=$([int]($LASTEXITCODE -ne 0))" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          exit 0

      - name: Open or update the issue
        if: steps.check.outputs.failed == '1'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $report = "$env:RUNNER_TEMP/data-health.md"
          $open = gh issue list --state open --search 'Data health in:title' --json number --jq '.[0].number'
          if ($open) {
            gh issue comment $open --body-file $report
          } else {
            gh issue create --title 'Data health: a source needs attention' --body-file $report
          }
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Close the issue when the daily check is clean
        if: steps.check.outputs.failed == '0' && steps.check.outputs.mode == 'Daily'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $open = gh issue list --state open --search 'Data health in:title' --json number --jq '.[0].number'
          if ($open) { gh issue close $open --comment 'All daily data-health checks pass.' }
          exit 0
