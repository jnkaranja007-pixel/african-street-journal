name: Update Economy Layer

# Monthly: pull fresh World Bank GDP/growth/series for all 55 countries, patch the
# compiled data bundle, regenerate app-core.js + country chunks, commit. The script
# aborts (exit 1) if the API returns fewer than 40 countries, so a flaky month can
# never wipe good data. No API key needed - the World Bank API is open.

on:
  schedule:
    - cron: '0 4 3 * *'    # 04:00 UTC on the 3rd of each month
  workflow_dispatch: {}     # manual "Run workflow" button

permissions:
  contents: write

concurrency:
  group: update-economy
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Refresh World Bank economy layer
        shell: pwsh
        run: ./scripts/build-economy.ps1

      - name: Commit refreshed economy data
        shell: pwsh
        run: |
          git config user.name  "asj-economy-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/app-data.js data/app-core.js data/countries
          # See update-news.yml: `(cmd; $LASTEXITCODE -eq 0)` is a ParserError.
          git diff --staged --quiet
          if ($LASTEXITCODE -eq 0) { Write-Host 'No economy changes this run.'; exit 0 }
          $stamp = (Get-Date).ToUniversalTime().ToString('yyyy-MM')
          git commit -m "chore(economy): refresh World Bank layer ($stamp)"
          if ($LASTEXITCODE -ne 0) { Write-Host 'Commit failed.'; exit 1 }
          # See update-news.yml: main can move during a long run, so rebase and retry
          # rather than losing the work to a rejected non-fast-forward push.
          $pushed = $false
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            git push
            if ($LASTEXITCODE -eq 0) { $pushed = $true; break }
            Write-Host "Push rejected (attempt $attempt) - rebasing onto origin/main and retrying."
            git pull --rebase origin main
            if ($LASTEXITCODE -ne 0) { Write-Host 'Rebase failed - resolve by hand.'; exit 1 }
          }
          if (-not $pushed) { Write-Host 'Push failed after 3 attempts.'; exit 1 }
          Write-Host 'Pushed refreshed economy layer'
