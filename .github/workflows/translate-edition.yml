name: Language editions

# After each desk edition, translate the new stories with the free Gemini tier
# (scripts/translate-briefs.ps1) and rebuild each language's pages
# (scripts/build-lang-pages.ps1): French /fr/, Portuguese /pt/, Swahili /sw/ and
# Arabic /ar/, plus Amharic /am/, Hausa /ha/, Somali /soomaali/ and isiZulu /zu/ for
# their own countries. One language after another, because they share one key's rate limit.
# Only new or changed stories are sent, so a normal run takes minutes; a new language's
# first run catches up on the whole edition within its time budget and finishes the rest
# on the next run. The English edition never waits for this.
on:
  workflow_run:
    workflows: ["Update ASJ Desk"]
    types: [completed]
  workflow_dispatch:
    inputs:
      languages:
        description: 'Languages to run, space separated (default: all)'
        required: false
        default: 'fr pt sw ar am ha so zu'
      minutes:
        description: 'Translation time budget per language, minutes'
        required: false
        default: '22'

permissions:
  contents: write

concurrency:
  group: asj-translate
  cancel-in-progress: false

jobs:
  editions:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Translate and build each language
        shell: pwsh
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ASJ_TRANSLATE_MODEL: ${{ vars.ASJ_TRANSLATE_MODEL }}
          LANGS: ${{ github.event.inputs.languages || 'fr pt sw ar am ha so zu' }}
          MINUTES: ${{ github.event.inputs.minutes || '22' }}
        run: |
          # The whole step shares one clock: eight languages at 22 minutes each would pass
          # the job's 110-minute limit, and a job cancelled at the limit never reaches Publish
          # (24 Nov 2026, two runs lost to HTTP 503 retries). Each language gets at most its
          # budget and never more than what is left; pages are still built when none is left.
          $clock = [Diagnostics.Stopwatch]::StartNew()
          $total = 90
          foreach ($l in ($env:LANGS -split '\s+' | Where-Object { $_ })) {
            if (-not (Test-Path "data/i18n/$l.json")) { Write-Host "[$l] no data/i18n/$l.json; skipped"; continue }
            $left = [int][Math]::Floor($total - $clock.Elapsed.TotalMinutes)
            $budget = [Math]::Min([int]$env:MINUTES, $left)
            # One language failing never costs the others their pages.
            try {
              if ($budget -ge 3) { ./scripts/translate-briefs.ps1 -Lang $l -Minutes $budget }
              else { Write-Host "[$l] no time left for translation in this run; pages rebuilt from what is already translated" }
              ./scripts/build-lang-pages.ps1 -Lang $l
            } catch { Write-Host "::warning::[$l] $($_.Exception.Message)" }
          }
          exit 0

      - name: Publish
        if: always()
        shell: bash
        run: |
          git config user.name 'asj-news-bot'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          # Folders are each language's "path": Somali lives in soomaali/ because so/ is Somalia.
          for d in fr pt sw ar am ha soomaali zu; do [ -d "$d" ] && git add --all -- "$d"; done
          for l in fr pt sw ar am ha so zu; do
            for f in "data/briefs-$l.json" "data/pages-$l.json"; do [ -f "$f" ] && git add -- "$f"; done
          done
          if git diff --staged --quiet; then echo "No new translated pages."; exit 0; fi
          git commit -q -m "chore(asj-lang): language editions ($(date -u +%F))"
          for i in 1 2 3; do
            if git pull -q --rebase origin main && git push -q origin main; then echo "Pushed."; exit 0; fi
            echo "Push failed (attempt $i); retrying"; sleep 15
          done
          echo "::error::Could not push the language editions"; exit 1
