name: Update AI Desk

# Each morning, Claude searches the web for the top stories per country and writes
# data/briefs.js (ranked, neutral, with source citations), then commits it.
# Runs in the cloud - no PC needed. Also triggerable by hand from the Actions tab.

on:
  schedule:
    - cron: '0 5 * * *'   # 05:00 UTC daily (~08:00 EAT)
  workflow_dispatch:       # manual "Run workflow" button
    inputs:
      only:
        description: 'Limit to these ISO-2 codes, e.g. ng,ke,za. Empty runs all 55. Use a short list to smoke-test the pipeline for pennies before a full run.'
        required: false
        default: ''

permissions:
  contents: write          # allow the action to commit briefs.js back to the repo

concurrency:
  group: update-ai-desk
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: windows-latest   # matches the local dev env (curl.exe + PowerShell)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build AI Desk briefs (web-searched, ranked)
        shell: pwsh
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if (-not $env:ANTHROPIC_API_KEY) {
            Write-Host 'ANTHROPIC_API_KEY secret not set - add it under Settings > Secrets and variables > Actions.'
            exit 0
          }
          $only = '${{ github.event.inputs.only }}'
          if ($only.Trim()) {
            $codes = $only -split ',' | ForEach-Object { $_.Trim() } | Where-Object { $_ }
            Write-Host "Limited run: $($codes -join ', ')"
            ./scripts/build-briefs.ps1 -Only $codes
          } else {
            ./scripts/build-briefs.ps1
          }

      - name: Validate before publishing
        shell: pwsh
        run: |
          # Publication gate: a malformed or empty run must fail the job (GitHub emails you)
          # rather than pushing broken data to the live journal overnight.
          if (Test-Path data/briefs.js) { ./scripts/validate-briefs.ps1 }
          else { Write-Host 'No briefs.js produced; nothing to validate.' }

      - name: Audit sources and quality
        shell: pwsh
        run: |
          # Fetches every source URL. Only a 404/410 fails the run - that is a citation
          # with nothing behind it, which is the one error this paper must never publish.
          # Unreachable hosts only add a quality penalty, so a flaky network cannot block
          # the desk. Prints a REWRITE line naming the weakest countries for a later pass.
          if (Test-Path data/briefs.js) { ./scripts/audit-briefs.ps1 -CheckLinks -Worst 8 }
          else { Write-Host 'No briefs.js produced; nothing to audit.' }

      - name: Commit refreshed briefs
        shell: pwsh
        run: |
          if (-not (Test-Path data/briefs.js)) { Write-Host 'No briefs.js produced; nothing to commit.'; exit 0 }
          git config user.name  "asj-news-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # briefs-state.json MUST be committed: it is the merge memory that lets a country
          # keep its last good briefs when a daily run partially fails.
          git add data/briefs.js data/briefs-state.json data/archive
          # `(cmd; $LASTEXITCODE -eq 0)` is a PowerShell ParserError - a grouping
          # expression cannot contain a statement separator. Run the check, then read
          # the exit code on its own line.
          git diff --staged --quiet
          if ($LASTEXITCODE -eq 0) { Write-Host 'No brief changes this run.'; exit 0 }
          $stamp = (Get-Date).ToUniversalTime().ToString('yyyy-MM-dd HH:mm UTC')
          git commit -m "chore(ai-desk): refresh briefs ($stamp)"
          if ($LASTEXITCODE -ne 0) { Write-Host 'Commit failed.'; exit 1 }
          # The desk runs 25+ minutes, so main can move while it works. A plain push
          # would then be rejected as non-fast-forward and the whole run's briefs are
          # lost with the workspace. Rebase onto the current main and retry instead.
          $pushed = $false
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            git push
            if ($LASTEXITCODE -eq 0) { $pushed = $true; break }
            Write-Host "Push rejected (attempt $attempt) - rebasing onto origin/main and retrying."
            git pull --rebase origin main
            if ($LASTEXITCODE -ne 0) { Write-Host 'Rebase failed - resolve by hand.'; exit 1 }
          }
          if (-not $pushed) { Write-Host 'Push failed after 3 attempts.'; exit 1 }
          Write-Host 'Pushed refreshed briefs.js'
