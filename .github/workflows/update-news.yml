name: Update ASJ Desk

# Each morning the desk reads verified African news feeds, clusters the same event
# across outlets, scores six candidates, and turns five assignments into original
# on-site stories. Runs in the cloud - no PC needed. Also triggerable by hand.
#
# The model receives numbered evidence packets and returns only those item indexes.
# Citations are attached from feed records afterwards, so it cannot invent an outlet URL.

on:
  schedule:
    # The paper is for readers in Africa, so it has to be on the doorstep before the
    # continent wakes. Nairobi and Addis (UTC+3) rise around 06:00 local, which is
    # 03:00 UTC; Lagos and Kinshasa (UTC+1) at 05:00 UTC. A run takes about 30 minutes,
    # so the last useful start for East Africa is roughly 02:30 UTC.
    #
    # Moving off the hour did not help: 05:17 was still queued eleven hours on
    # 28 August. GitHub deprioritises scheduled runs on free public repositories and no
    # setting changes that, so the answer is several early attempts rather than one
    # hopeful slot. The freshness guard makes every attempt after a successful one cost
    # a few seconds, so this buys reliability rather than compute.
    # Cut from five attempts to two on 20 Oct 2026. Five failing attempts burned
    # ~150 runner-minutes a day for six weeks; the desk now fails fast on API errors,
    # and one retry two hours later still lands before East Africa wakes.
    - cron: '40 1 * * *'    # 04:40 EAT - first attempt, well before dawn
    - cron: '40 3 * * *'    # 06:40 EAT - retry if the first was queued or failed
  workflow_dispatch:
    inputs:
      only:
        description: 'Limit to these ISO-2 codes, e.g. ng,ke,za. Empty runs all 55.'
        required: false
        default: ''
      provider:
        description: 'Optional provider override for this run only: openrouter or gemini.'
        required: false
        default: ''
      model:
        description: 'Optional OpenRouter model slug override for this run.'
        required: false
        default: ''

permissions:
  contents: write
  # The desk opens an issue when it fails, so a broken night reaches a notification
  # instead of dying in a log nobody opens.
  issues: write

concurrency:
  group: update-ai-desk
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Skip if today's edition already published
        id: guard
        shell: pwsh
        run: |
          # The second daily attempt exists only to cover a delayed or failed first one.
          # If the edition is already out, every step below is skipped and the run costs
          # seconds instead of a second full model spend.
          $stale = 'true'
          # The guard exists to stop the second SCHEDULED attempt repeating work the
          # first already did. A manual dispatch is an explicit instruction to run, so it
          # must never be skipped - otherwise there is no way to force a re-run on a day
          # the edition has already published, including to test this workflow.
          if ($env:GITHUB_EVENT_NAME -ne 'schedule') {
            Write-Host "event=$env:GITHUB_EVENT_NAME - not a scheduled run, proceeding regardless"
            "stale=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            exit 0
          }
          if (Test-Path data/briefs.js) {
            $raw = [IO.File]::ReadAllText((Resolve-Path data/briefs.js).Path, [Text.Encoding]::UTF8)
            $m = [regex]::Match($raw, "generated:\s*'([^']+)'")
            if ($m.Success) {
              $genDay = if ($m.Groups[1].Value -match '^(\d{4}-\d{2}-\d{2})') { $Matches[1] } else { '' }
              $today = (Get-Date).ToUniversalTime().ToString('yyyy-MM-dd')
              if ($genDay -eq $today) { $stale = 'false' }
              Write-Host "edition generated $genDay, today $today, stale=$stale"
            }
          }
          "stale=$stale" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Test assignment ranking
        shell: pwsh
        run: |
          # A pwsh step fails on the LAST command's exit code only, so without the checks
          # between them a failing ranking or contract test was silently passed over.
          ./scripts/test-news-ranking.ps1;     if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./scripts/test-story-contract.ps1;   if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./scripts/test-article-evidence.ps1; if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./scripts/test-publication-gate.ps1; if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./scripts/test-static-pages.ps1 -UnitOnly

      - name: Gather and rank today's stories
        if: steps.guard.outputs.stale == 'true'
        shell: pwsh
        run: |
          # No API key needed for this step. Feeds are public RSS, spread across ~200
          # domains so no single host sees more than a handful of requests.
          $only = '${{ github.event.inputs.only }}'
          if ($only.Trim()) { ./scripts/fetch-news.ps1 -Only $only.Trim() }
          else { ./scripts/fetch-news.ps1 }

      - name: Restore story cache
        id: storycache
        if: steps.guard.outputs.stale == 'true'
        uses: actions/cache/restore@v5
        with:
          path: data/story-cache.json
          key: ${{ runner.os }}-asj-story-v1-${{ hashFiles('scripts/write-briefs.ps1', 'scripts/news-ranking.ps1') }}
          restore-keys: |
            ${{ runner.os }}-asj-story-v1-

      - name: Check OpenRouter credit
        if: steps.guard.outputs.stale == 'true'
        continue-on-error: true
        shell: pwsh
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Warn days before the money runs out, not the morning after. Never fails the run.
          if (-not $env:OPENROUTER_API_KEY) { Write-Host 'No OpenRouter key; skipping credit check.'; exit 0 }
          $h = @{ Authorization = "Bearer $env:OPENROUTER_API_KEY" }
          $remaining = $null
          try {
            $c = (Invoke-RestMethod -Uri 'https://openrouter.ai/api/v1/credits' -Headers $h -TimeoutSec 20).data
            $remaining = [double]$c.total_credits - [double]$c.total_usage
          } catch {
            try {
              $k = (Invoke-RestMethod -Uri 'https://openrouter.ai/api/v1/key' -Headers $h -TimeoutSec 20).data
              if ($null -ne $k.limit_remaining) { $remaining = [double]$k.limit_remaining }
            } catch { Write-Host "Credit check unavailable: $($_.Exception.Message)" }
          }
          if ($null -eq $remaining) { exit 0 }
          Write-Host ("OpenRouter credit remaining: `${0:N2}" -f $remaining)
          if ($remaining -lt 2) {
            $title = 'ASJ OpenRouter credit is low'
            $nights = [Math]::Floor($remaining / 0.14)
            $body = "@jnkaranja007-pixel - OpenRouter credit is down to `$$('{0:N2}' -f $remaining), about $nights more nightly editions at ~`$0.13 each. Top up at https://openrouter.ai/settings/credits. (If GEMINI_API_KEY is set, the desk falls back to Google's free tier when credit runs out.)"
            $existing = gh issue list --state open --search "$title in:title" --json number,title --limit 5 | ConvertFrom-Json | Where-Object { $_.title -eq $title } | Select-Object -First 1
            if ($existing) { gh issue comment $existing.number --body $body } else { gh issue create --title $title --body $body }
          } else {
            $existing = gh issue list --state open --search "ASJ OpenRouter credit is low in:title" --json number,title --limit 5 | ConvertFrom-Json | Where-Object { $_.title -eq 'ASJ OpenRouter credit is low' } | Select-Object -First 1
            if ($existing) { gh issue close $existing.number --comment ("Credit is back to `${0:N2}. Closing." -f $remaining) }
          }

      - name: Write on-site stories
        if: steps.guard.outputs.stale == 'true'
        shell: pwsh
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # Model choice lives in repository variables so it can change without a commit:
          #   gh variable set ASJ_MODEL --body google/gemini-2.5-flash-lite
          #   gh variable set ASJ_FALLBACK_MODELS --body 'google/gemini-3.1-flash-lite,deepseek/deepseek-v3.2'
          ASJ_MODEL: ${{ github.event.inputs.model || vars.ASJ_MODEL }}
          ASJ_FALLBACK_MODELS: ${{ vars.ASJ_FALLBACK_MODELS }}
          # Free alternative: create a key at https://aistudio.google.com/apikey, then
          #   gh secret set GEMINI_API_KEY ; gh variable set ASJ_PROVIDER --body gemini
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ASJ_PROVIDER: ${{ github.event.inputs.provider || vars.ASJ_PROVIDER }}
        run: |
          if (-not $env:OPENROUTER_API_KEY -and -not $env:GEMINI_API_KEY) {
            # Failing loudly on purpose. Exiting 0 here would let the journal quietly
            # go stale for weeks with every run reporting success.
            Write-Host 'OPENROUTER_API_KEY secret is not set.'
            Write-Host 'Add it with: gh secret set OPENROUTER_API_KEY'
            exit 1
          }
          $only = '${{ github.event.inputs.only }}'
          # Tee to a file: the alarm step cannot read this run's log through the API while
          # the run is still going, so it reads the reason from here instead.
          if ($only.Trim()) { ./scripts/write-briefs.ps1 -Only $only.Trim() -JsonMode -OutFile data/auto-briefs.json *>&1 | Tee-Object -FilePath desk-write.log }
          else { ./scripts/write-briefs.ps1 -JsonMode -OutFile data/auto-briefs.json *>&1 | Tee-Object -FilePath desk-write.log }
          exit $LASTEXITCODE

      - name: Merge into the journal
        if: steps.guard.outputs.stale == 'true'
        shell: pwsh
        run: |
          # add-briefs writes BOTH data/briefs.js and data/briefs-state.json. The state
          # file is the merge memory that lets a country keep its last good briefs when
          # a run covers only part of the map.
          ./scripts/add-briefs.ps1 -InFile data/auto-briefs.json

      - name: Validate before publishing
        if: steps.guard.outputs.stale == 'true'
        shell: pwsh
        run: |
          $only = '${{ github.event.inputs.only }}'
          if ($only.Trim()) {
            $requested = @($only -split ',' | ForEach-Object { $_.Trim() } | Where-Object { $_ }).Count
            # Same floor as the full run. Leaving this at five while the writer publishes
            # from three would fail a targeted run for a country that filed four sound
            # stories - the exact all-or-nothing trap that kept the site stale for days.
            ./scripts/validate-briefs.ps1 -MinCountries 50 -MinStoryPackages $requested -MinFreshCountries $requested -RequiredFreshCountries $only -FreshStoriesPerCountry 1
          } else {
            # Freshness means 'did this country get new reporting today', not 'did it hit five'.
            # Comoros and Guinea-Bissau field two sound stories a day; counting those as
            # stale made the gate reward a blank page over a thin one.
            # Partial publish: ten fresh countries is enough to ship. Countries the writer
            # missed keep their last good stories (add-briefs merges, it never blanks).
            ./scripts/validate-briefs.ps1 -MinCountries 55 -MinStoryPackages 150 -MinFreshCountries 10 -FreshStoriesPerCountry 1
          }

      - name: Audit sources and quality
        if: steps.guard.outputs.stale == 'true'
        shell: pwsh
        run: |
          # Fetches every cited URL. Only 404/410 fails the run - that is a citation with
          # nothing behind it. 401/403 are bot walls on live pages and must not fail the
          # desk, or Cloudflare-fronted outlets would block publication every night.
          ./scripts/audit-briefs.ps1 -CheckLinks -Worst 8 -RejectFile data/audit-reject.json
          if ($LASTEXITCODE -eq 0) { exit 0 }
          # Degrade, don't die: drop only the stories behind critical findings, re-merge
          # from the last committed state, and audit again (strictly) before publishing.
          $ids = @()
          if (Test-Path data/audit-reject.json) { $ids = @(Get-Content data/audit-reject.json -Raw | ConvertFrom-Json) }
          if (-not $ids.Count) { Write-Host 'Audit failed with nothing droppable.'; exit 1 }
          Write-Host "Dropping $($ids.Count) story(ies) with critical findings and re-merging: $($ids -join ', ')"
          git checkout -- data/briefs.js data/briefs-full.js data/briefs-state.json data/archive
          $auto = Get-Content data/auto-briefs.json -Raw -Encoding utf8 | ConvertFrom-Json
          foreach ($p in $auto.PSObject.Properties) { $p.Value = @($p.Value | Where-Object { $ids -notcontains [string]$_.articleId }) }
          [IO.File]::WriteAllText("$PWD/data/auto-briefs.json", ($auto | ConvertTo-Json -Depth 12), (New-Object Text.UTF8Encoding($false)))
          ./scripts/add-briefs.ps1 -InFile data/auto-briefs.json
          if ($LASTEXITCODE -ne 0) { exit 1 }
          ./scripts/validate-briefs.ps1 -MinCountries 55 -MinStoryPackages 150 -MinFreshCountries 1 -FreshStoriesPerCountry 1
          if ($LASTEXITCODE -ne 0) { exit 1 }
          ./scripts/audit-briefs.ps1 -CheckLinks -Worst 8
          exit $LASTEXITCODE

      - name: Rebuild crawlable pages and sitemap
        if: steps.guard.outputs.stale == 'true'
        shell: pwsh
        run: |
          # The app routes on hash fragments, which crawlers discard, so these static
          # pages are the only version a search engine can read. Change -BaseUrl here on
          # the day a custom domain goes live.
          ./scripts/build-static-pages.ps1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          # Re-run the page checks against what was just written. The copy in the test
          # step above sees yesterday's pages, so on its own it reports a bad date a day
          # after it shipped. Checking here is what stops one leaving the runner.
          ./scripts/test-static-pages.ps1

      # Saved even when a later step fails, so a rerun reuses stories already paid for.
      - name: Save story cache
        if: always() && steps.guard.outputs.stale == 'true' && hashFiles('data/story-cache.json') != ''
        uses: actions/cache/save@v5
        with:
          path: data/story-cache.json
          key: ${{ runner.os }}-asj-story-v1-${{ hashFiles('scripts/write-briefs.ps1', 'scripts/news-ranking.ps1') }}-${{ github.run_id }}

      - name: Save desk efficiency metrics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: desk-run-metrics
          path: data/desk-run-metrics.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Commit refreshed stories
        if: steps.guard.outputs.stale == 'true'
        shell: pwsh
        run: |
          # publish-edition.ps1 owns the staging list and the push. If main moved during
          # the run it rebuilds the edition on top of it rather than rebasing generated
          # files - a rebase of 290 regenerated pages cannot succeed, and on 21 October
          # it threw away 41 minutes of finished, audited stories.
          $only = '${{ github.event.inputs.only }}'
          if ($only.Trim()) {
            $requested = @($only -split ',' | ForEach-Object { $_.Trim() } | Where-Object { $_ }).Count
            ./scripts/publish-edition.ps1 -MinCountries 50 -MinStoryPackages $requested -MinFreshCountries $requested -RequiredFreshCountries $only -FreshStoriesPerCountry 1
          } else {
            ./scripts/publish-edition.ps1 -MinCountries 55 -MinStoryPackages 150 -MinFreshCountries 10 -FreshStoriesPerCountry 1
          }
          exit $LASTEXITCODE

      - name: Ping IndexNow with new stories
        if: steps.guard.outputs.stale == 'true'
        continue-on-error: true
        shell: pwsh
        run: |
          # Tells Bing and other IndexNow engines about the homepage and every story
          # from the last 48 hours. Logs the HTTP code; never fails the run.
          ./scripts/submit-indexnow.ps1

      - name: Raise the alarm if the desk failed
        if: failure()
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The desk ran out of OpenRouter credit on 6 September 2026 and failed every
          # run for fifteen days. Every one of those runs went red, and none of it
          # reached anyone: the site kept serving the last good edition, so there was
          # nothing to notice unless you happened to open the Actions tab.
          #
          # One open issue, updated - not a new issue per run. The desk attempts five
          # times a day, so creating an issue each time would bury the signal in the
          # noise it was meant to cut through.
          $title = 'ASJ desk is failing'
          $existing = gh issue list --state open --search "$title in:title" --json number,title --limit 5 |
                      ConvertFrom-Json |
                      Where-Object { $_.title -eq $title } |
                      Select-Object -First 1

          # Name the actual cause where we can recognise it. "The workflow failed" sends
          # someone to read logs; "the account is out of credit" is an instruction.
          $reason = 'The run failed. Open the log to see which step.'
          $log = ''
          try { $log = gh run view $env:GITHUB_RUN_ID --log 2>$null | Out-String } catch {}
          if (Test-Path desk-write.log) { $log += (Get-Content desk-write.log -Raw) }
          if ($log -match 'FAIL FAST' -and $log -notmatch 'HTTP 402'){
            $reason = 'The model API returned errors on 3 calls in a row, so the run stopped early. The log line starting [api] shows OpenRouter''s exact response.'
          } elseif ($log -match 'HTTP 402|credit unavailable') {
            $reason = 'OpenRouter is out of credit (HTTP 402). Add credit at https://openrouter.ai/settings/credits, then run the desk by hand with: gh workflow run update-news.yml'
          } elseif ($log -match 'OPENROUTER_API_KEY secret is not set') {
            $reason = 'The OPENROUTER_API_KEY secret is missing or empty.'
          } elseif ($log -match 'HTTP 401|invalid api key|No auth credentials') {
            $reason = 'OpenRouter rejected the API key (HTTP 401). The key may have been rotated or revoked.'
          } elseif ($log -match 'not safe to publish') {
            $reason = 'The publication gate refused the edition. The stories were written but did not meet the contract.'
          } elseif ($log -match '\[publish\] (Could not rebuild|Push failed|Could not fetch|Commit failed)') {
            $reason = 'The stories were written and passed every check, but could not be pushed: main kept moving while the desk worked and the rebuild on top of it failed. Run the desk again by hand: gh workflow run update-news.yml'
          }

          $runUrl = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          $stamp = (Get-Date).ToUniversalTime().ToString('yyyy-MM-dd HH:mm UTC')
          # Built as an array, not a here-string: PowerShell requires the closing "@ at
          # column zero, and inside a YAML run: block every line is indented, so a
          # here-string here is a parse error at runtime. check-workflows.ps1 catches it.
          $body = @(
            "@jnkaranja007-pixel - the nightly desk failed at $stamp.",
            "",
            "**$reason**",
            "",
            "Run: $runUrl",
            "",
            "The site is still up and serving the last good edition; it is not broken, it",
            "is frozen - and nothing on the page tells readers that, so treat a long gap as",
            "urgent. Each country page shows when its desk last filed.",
            "",
            "This issue stays open and is updated on each failure. Close it once the desk",
            "publishes again."
          ) -join "`n"

          if ($existing) {
            gh issue comment $existing.number --body $body
            Write-Host "Updated issue #$($existing.number)"
          } else {
            gh issue create --title $title --body $body
            Write-Host 'Opened a new issue'
          }

      - name: Close the alarm once the desk publishes
        if: success() && steps.guard.outputs.stale == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # An alarm that only ever opens is an alarm people learn to ignore.
          $title = 'ASJ desk is failing'
          $existing = gh issue list --state open --search "$title in:title" --json number,title --limit 5 |
                      ConvertFrom-Json |
                      Where-Object { $_.title -eq $title } |
                      Select-Object -First 1
          if ($existing) {
            gh issue close $existing.number --comment 'The desk published successfully. Closing.'
            Write-Host "Closed issue #$($existing.number)"
          } else {
            Write-Host 'No open alarm to close.'
          }
