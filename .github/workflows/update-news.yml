name: Update AI Desk

# Each morning the desk reads verified African news feeds, clusters the same event
# across outlets, scores six candidates, and turns five assignments into original
# on-site stories. Runs in the cloud - no PC needed. Also triggerable by hand.
#
# The model receives numbered evidence packets and returns only those item indexes.
# Citations are attached from feed records afterwards, so it cannot invent an outlet URL.

on:
  schedule:
    - cron: '0 5 * * *'   # 05:00 UTC daily (~08:00 EAT)
  workflow_dispatch:
    inputs:
      only:
        description: 'Limit to these ISO-2 codes, e.g. ng,ke,za. Empty runs all 55.'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: update-ai-desk
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test assignment ranking
        shell: pwsh
        run: |
          ./scripts/test-news-ranking.ps1
          ./scripts/test-story-contract.ps1
          ./scripts/test-article-evidence.ps1

      - name: Gather and rank today's stories
        shell: pwsh
        run: |
          # No API key needed for this step. Feeds are public RSS, spread across ~200
          # domains so no single host sees more than a handful of requests.
          $only = '${{ github.event.inputs.only }}'
          if ($only.Trim()) { ./scripts/fetch-news.ps1 -Only $only.Trim() }
          else { ./scripts/fetch-news.ps1 }

      - name: Restore story cache
        uses: actions/cache@v4
        with:
          path: data/story-cache.json
          key: ${{ runner.os }}-asj-story-v1-${{ hashFiles('scripts/write-briefs.ps1', 'scripts/news-ranking.ps1') }}
          restore-keys: |
            ${{ runner.os }}-asj-story-v1-

      - name: Write on-site stories
        shell: pwsh
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if (-not $env:OPENROUTER_API_KEY) {
            # Failing loudly on purpose. Exiting 0 here would let the journal quietly
            # go stale for weeks with every run reporting success.
            Write-Host 'OPENROUTER_API_KEY secret is not set.'
            Write-Host 'Add it with: gh secret set OPENROUTER_API_KEY'
            exit 1
          }
          $only = '${{ github.event.inputs.only }}'
          if ($only.Trim()) { ./scripts/write-briefs.ps1 -Only $only.Trim() -JsonMode -OutFile data/auto-briefs.json }
          else { ./scripts/write-briefs.ps1 -JsonMode -OutFile data/auto-briefs.json }

      - name: Merge into the journal
        shell: pwsh
        run: |
          # add-briefs writes BOTH data/briefs.js and data/briefs-state.json. The state
          # file is the merge memory that lets a country keep its last good briefs when
          # a run covers only part of the map.
          ./scripts/add-briefs.ps1 -InFile data/auto-briefs.json

      - name: Validate before publishing
        shell: pwsh
        run: ./scripts/validate-briefs.ps1 -MinCountries 50 -MinStoryPackages 5

      - name: Audit sources and quality
        shell: pwsh
        run: |
          # Fetches every cited URL. Only 404/410 fails the run - that is a citation with
          # nothing behind it. 401/403 are bot walls on live pages and must not fail the
          # desk, or Cloudflare-fronted outlets would block publication every night.
          ./scripts/audit-briefs.ps1 -CheckLinks -Worst 8

      - name: Rebuild crawlable pages and sitemap
        shell: pwsh
        run: |
          # The app routes on hash fragments, which crawlers discard, so these static
          # pages are the only version a search engine can read. Change -BaseUrl here on
          # the day a custom domain goes live.
          ./scripts/build-static-pages.ps1

      - name: Save desk efficiency metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desk-run-metrics
          path: data/desk-run-metrics.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Commit refreshed briefs
        shell: pwsh
        run: |
          git config user.name  "asj-news-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/briefs.js data/briefs-state.json data/archive sitemap.xml robots.txt
          Get-ChildItem -Directory | Where-Object { $_.Name -match '^[a-z]{2}$' } | ForEach-Object { git add "$($_.Name)/index.html" }
          # `(cmd; $LASTEXITCODE -eq 0)` is a PowerShell ParserError - a grouping
          # expression cannot contain a statement separator. Run the check, then read
          # the exit code on its own line.
          git diff --staged --quiet
          if ($LASTEXITCODE -eq 0) { Write-Host 'No story changes this run.'; exit 0 }
          $stamp = (Get-Date).ToUniversalTime().ToString('yyyy-MM-dd HH:mm UTC')
          git commit -m "chore(ai-desk): refresh briefs ($stamp)"
          if ($LASTEXITCODE -ne 0) { Write-Host 'Commit failed.'; exit 1 }
          # The desk runs long enough that main can move while it works. A plain push
          # would then be rejected as non-fast-forward and the whole run's briefs lost
          # with the workspace. Rebase onto current main and retry instead.
          $pushed = $false
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            git push
            if ($LASTEXITCODE -eq 0) { $pushed = $true; break }
            Write-Host "Push rejected (attempt $attempt) - rebasing onto origin/main and retrying."
            git pull --rebase origin main
            if ($LASTEXITCODE -ne 0) { Write-Host 'Rebase failed - resolve by hand.'; exit 1 }
          }
          if (-not $pushed) { Write-Host 'Push failed after 3 attempts.'; exit 1 }
          Write-Host 'Pushed refreshed stories'
