<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Not found | The African Street Journal</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#131313">
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:#131313;color:#e8e6e3;font:16px/1.6 system-ui,-apple-system,'Segoe UI',sans-serif;
     min-height:100vh;display:flex;align-items:center;justify-content:center;padding:0 24px;text-align:center}
.wrap{max-width:560px}
.masthead{font:600 14px/1 system-ui,-apple-system,'Segoe UI',sans-serif;color:#8a847b;margin-bottom:28px}
.masthead a{color:#8a847b;text-decoration:none}
/* Same face as every other page title; Georgia only until the webfont arrives. */
h1{font:700 clamp(28px,6vw,44px)/1.1 'Playfair Display',Georgia,'Times New Roman',serif;margin:0 0 14px;color:#f2f0ed}
p{color:#a8a39d;margin:0 0 22px}
a.go{display:inline-block;font:600 15px/1 system-ui,-apple-system,'Segoe UI',sans-serif;
     color:#66bb6a;text-decoration:none;border-bottom:1px solid #2f5c33;padding-bottom:6px}
.links a{color:#8a847b;margin:0 9px;text-decoration:none}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&display=swap">
</head>
<body>
<div class="wrap">
  <div class="masthead"><a href="/">The African Street Journal</a></div>
  <h1 id="title">That page has moved on</h1>
  <p id="copy">Stories keep a page of their own for a week. This one is older than that, but the desk is still here.</p>
  <a class="go" id="go" href="/">Go to the front page &rarr;</a>
  <p class="links" style="margin-top:28px;font:400 14px/1.9 system-ui,-apple-system,'Segoe UI',sans-serif"><a href="/about/">About</a><a href="/privacy/">Privacy</a><a href="/contact/">Contact</a><a href="/corrections/">Corrections</a></p>
</div>
<script>
// A story keeps its own page for a week; after that the page is swept so the
// repository does not grow without bound. A link shared a fortnight ago should still
// land somewhere useful, so an expired /<cc>/<slug>/ is sent to /<cc>/ - the country
// it belonged to, which still carries today's reporting.
(function () {
  var parts = location.pathname.split('/').filter(Boolean);
  var cc = parts[0] || '';
  if (!/^[a-z]{2}$/.test(cc)) return;
  var go = document.getElementById('go');
  go.href = '/' + cc + '/';
  go.innerHTML = 'Go to the country desk &rarr;';
  document.getElementById('copy').textContent =
    'Stories keep a page of their own for a week. This one is older than that - the country desk has the current reporting.';
  // Give the reader a moment to see why, rather than bouncing them somewhere they
  // did not ask for.
  setTimeout(function () { location.replace('/' + cc + '/'); }, 2500);
}());
</script>
</body>
</html>
